<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Questlog – Entwurf Wäsche', '/js/draft.js')}"></head>
<body class="bg-base-100 text-base-content">
<div class="mx-auto flex min-h-dvh max-w-md flex-col px-5" x-data="laundryDraft">

  <!-- Gehört nur zum Entwurf: öffnet die Erklärung der aktuellen Ansicht. -->
  <div class="flex justify-end pt-2">
    <button type="button" class="btn btn-ghost btn-sm h-11 min-h-11 font-normal text-base-content/70"
            @click="notesOpen = true" :aria-expanded="notesOpen">Was passiert hier?</button>
  </div>

  <!-- Ablauf als Symbole: Etappen verbunden durch Linien, darunter die Schritte der aktuellen Etappe -->
  <header class="flex flex-col gap-3 pb-2" x-show="screen !== 'start' && screen !== 'done'" x-cloak>
    <div class="flex items-center" aria-hidden="true">
      <template x-for="(item, s) in quest.stages" :key="item.name">
        <div class="contents">
          <span class="grid size-10 shrink-0 place-items-center rounded-full transition-colors duration-300" :data-node="s"
                :class="{ 'bg-primary text-primary-content': stageState(s) === 'current', 'bg-primary/15 text-primary': stageState(s) === 'done', 'bg-base-200 text-base-content/40': stageState(s) === 'open' }">
            <template x-if="item.icon === 'washer'"><svg th:replace="~{fragments/icons :: washer('size-5')}"></svg></template>
            <template x-if="item.icon === 'hanger'"><svg th:replace="~{fragments/icons :: hanger('size-5')}"></svg></template>
            <template x-if="item.icon === 'basket'"><svg th:replace="~{fragments/icons :: basket('size-5')}"></svg></template>
          </span>
          <template x-if="s < quest.stages.length - 1">
            <div class="relative mx-1.5 h-0.5 flex-1 rounded-full bg-base-300">
              <div class="absolute inset-y-0 left-0 rounded-full bg-primary transition-[width] duration-[450ms] ease-out"
                   :style="`width: ${lineFill(s) * 100}%`"></div>
            </div>
          </template>
        </div>
      </template>
    </div>
    <div class="flex items-center justify-between">
      <span class="text-[15px] font-semibold" x-text="stage.name"></span>
      <span x-show="screen === 'step' || screen === 'missing'" class="flex items-center gap-1.5">
        <span class="sr-only" x-text="`Schritt ${stepIndex + 1} von ${stage.steps.length}`"></span>
        <template x-for="(_, k) in stage.steps" :key="stage.name + k">
          <span class="size-2.5 rounded-full border-[1.5px] transition-colors duration-200" :data-dot="k"
                :class="{ 'border-primary bg-primary': dotState(k) === 'done', 'border-primary bg-base-100': dotState(k) === 'current', 'border-base-300 bg-base-300': dotState(k) === 'open' }"></span>
        </template>
      </span>
      <span x-show="screen === 'wait' || screen === 'waitDone' || screen === 'time'" class="text-[15px] text-base-content/60" x-text="stage.wait?.label"></span>
    </div>
  </header>

  <main class="flex flex-1 flex-col">

    <!-- Start -->
    <section x-show="screen === 'start'" class="flex flex-1 flex-col">
      <div class="my-auto flex flex-col gap-8 py-10">
        <h1 data-enter class="text-[34px] font-bold leading-tight" x-text="quest.name"></h1>
        <ol data-enter class="flex flex-col">
          <template x-for="(item, s) in quest.stages" :key="item.name">
            <li class="flex flex-col">
              <div class="flex items-center gap-4">
                <span class="grid size-10 shrink-0 place-items-center rounded-full"
                      :class="s === 0 ? 'bg-primary text-primary-content' : 'bg-base-200 text-base-content/50'">
                  <template x-if="item.icon === 'washer'"><svg th:replace="~{fragments/icons :: washer('size-5')}"></svg></template>
                  <template x-if="item.icon === 'hanger'"><svg th:replace="~{fragments/icons :: hanger('size-5')}"></svg></template>
                  <template x-if="item.icon === 'basket'"><svg th:replace="~{fragments/icons :: basket('size-5')}"></svg></template>
                </span>
                <span class="text-[17px]" :class="s === 0 && 'font-semibold'" x-text="item.name"></span>
              </div>
              <template x-if="item.wait">
                <div class="flex min-h-12 items-center gap-4">
                  <span class="mx-[19px] w-0.5 self-stretch bg-base-300"></span>
                  <span class="text-[15px] text-base-content/50" x-text="`${item.wait.label}, ${duration(item.wait.presets[0])} bis ${duration(item.wait.presets[2])}`"></span>
                </div>
              </template>
            </li>
          </template>
        </ol>
      </div>
      <footer class="pb-6">
        <button type="button" class="btn btn-primary h-[52px] w-full text-[17px]" :class="buttonShape" @click="start($event)">Quest starten</button>
      </footer>
    </section>

    <!-- Schritt -->
    <section x-show="screen === 'step'" x-cloak class="flex flex-1 flex-col">
      <div class="relative my-auto py-10">
        <div x-ref="stepTitle" data-enter class="flex flex-col gap-4">
          <template x-if="step.needs">
            <span class="inline-flex items-center gap-2 self-start rounded-full bg-primary/12 py-2 pr-4 pl-3 text-[15px] font-semibold text-primary">
              <svg th:replace="~{fragments/icons :: key('size-5')}"></svg>
              <span x-text="step.needs.label"></span>
            </span>
          </template>
          <p class="text-[34px] font-semibold leading-tight" x-text="step.title"></p>
          <p class="-mt-2 text-[17px] text-base-content/60" x-show="step.hint" x-text="step.hint"></p>
        </div>
        <div x-ref="stepCheck" class="pointer-events-none absolute inset-0 grid place-items-center text-primary opacity-0">
          <svg th:replace="~{fragments/icons :: check('size-20')}"></svg>
        </div>
      </div>
      <footer class="flex flex-col gap-2 pb-6">
        <button type="button" x-show="step.missing" class="btn btn-ghost h-11 min-h-11 w-full text-[15px] font-normal text-base-content/70"
                @click="reportMissing($event)" x-text="step.missing?.label"></button>
        <button type="button" class="btn btn-primary h-[52px] w-full text-[17px]" :class="buttonShape" @click="complete($event)">Erledigt</button>
      </footer>
    </section>

    <!-- Voraussetzung fehlt -->
    <section x-show="screen === 'missing'" x-cloak class="flex flex-1 flex-col">
      <div class="my-auto flex flex-col gap-4 py-10">
        <span data-enter class="relative grid size-14 place-items-center rounded-full bg-error/12 text-error">
          <svg th:replace="~{fragments/icons :: detergent('size-7')}"></svg>
          <span class="absolute h-0.5 w-9 rotate-45 rounded-full bg-error"></span>
        </span>
        <p data-enter class="text-[34px] font-semibold leading-tight">Waschmittel fehlt</p>
        <p data-enter class="text-[17px] text-base-content/70">Die Quest wartet hier. Sobald Waschmittel da ist, geht es an dieser Stelle weiter.</p>
      </div>
      <footer class="pb-6">
        <button type="button" class="btn btn-primary h-[52px] w-full text-[17px]" :class="buttonShape" @click="resolveMissing($event)">Waschmittel ist da</button>
      </footer>
    </section>

    <!-- Wartezeit wählen -->
    <section x-show="screen === 'time'" x-cloak class="flex flex-1 flex-col">
      <div class="my-auto flex flex-col gap-6 py-10">
        <p data-enter class="text-[28px] font-semibold leading-tight" x-text="stage.wait?.question"></p>
        <div data-enter class="grid grid-cols-3 gap-2" role="group" aria-label="Vorgaben">
          <template x-for="preset in stage.wait?.presets ?? []" :key="preset">
            <button type="button" class="h-16 rounded-[14px] border-2 text-[17px] transition-colors"
                    :class="!customOpen && chosenMinutes === preset ? 'border-primary bg-primary/10 font-semibold text-primary' : 'border-base-300'"
                    :aria-pressed="!customOpen && chosenMinutes === preset"
                    @click="chosenMinutes = preset; customOpen = false" x-text="duration(preset)"></button>
          </template>
        </div>
        <div data-enter>
          <button type="button" x-show="!customOpen" class="btn btn-ghost h-11 min-h-11 px-0 text-[15px] font-normal text-base-content/70"
                  @click="customOpen = true">Andere Zeit</button>
          <div x-show="customOpen" class="flex items-center justify-between rounded-[14px] border-2 border-primary p-2">
            <button type="button" class="btn btn-ghost size-12 min-h-12 text-2xl" aria-label="Weniger" @click="adjust(-1)">−</button>
            <span class="text-[20px] font-semibold tabular-nums text-primary" x-text="duration(chosenMinutes)"></span>
            <button type="button" class="btn btn-ghost size-12 min-h-12 text-2xl" aria-label="Mehr" @click="adjust(1)">+</button>
          </div>
        </div>
      </div>
      <footer class="pb-6">
        <button type="button" class="btn btn-primary h-[52px] w-full text-[17px]" :class="buttonShape" @click="startTimer($event)">Timer starten</button>
      </footer>
    </section>

    <!-- Wartezeit -->
    <section x-show="screen === 'wait' || screen === 'waitDone'" x-cloak class="flex flex-1 flex-col">
      <div class="my-auto flex flex-col items-center gap-6 py-10 text-center">
        <div data-enter class="relative grid size-60 place-items-center">
          <svg class="absolute inset-0 -rotate-90" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="ql-ring-track" cx="50" cy="50" r="47" stroke-width="2.5"/>
            <circle x-ref="timerRing" class="ql-ring transition-[stroke-dashoffset] duration-1000 ease-linear"
                    cx="50" cy="50" r="47" stroke-width="2.5" pathLength="100" style="stroke-dashoffset: 0"/>
          </svg>
          <span x-show="screen === 'wait'" class="relative text-[34px] font-semibold tabular-nums" x-text="remainingText"></span>
          <span x-show="screen === 'waitDone'" class="relative text-primary">
            <svg th:replace="~{fragments/icons :: check('size-14')}"></svg>
          </span>
        </div>
        <div data-enter class="flex flex-col gap-1">
          <p class="text-[20px] font-semibold" x-text="screen === 'wait' ? `${stage.wait?.label} läuft` : `${stage.wait?.label} fertig`"></p>
          <p class="text-[15px] text-base-content/60" x-show="screen === 'wait'">
            Ich melde mich in <span x-text="duration(chosenMinutes)"></span>,<br>
            danach <span x-text="stage.wait?.reminder"></span>, bis du weitermachst.
          </p>
        </div>
      </div>
      <footer class="pb-6">
        <button type="button" x-show="screen === 'wait'" class="btn btn-ghost h-[52px] w-full font-normal text-base-content/60"
                @click="skipTime()">Zeit vorspulen (nur im Entwurf)</button>
        <button type="button" x-show="screen === 'waitDone'" class="btn btn-primary h-[52px] w-full text-[17px]" :class="buttonShape"
                @click="continueQuest($event)">Weiter: <span x-text="nextStage?.name"></span></button>
      </footer>
    </section>

    <!-- Abschluss -->
    <section x-show="screen === 'done'" x-cloak class="flex flex-1 flex-col">
      <div class="my-auto flex flex-col items-center gap-6 py-10 text-center">
        <div class="relative grid size-48 place-items-center">
          <div x-ref="sparks" class="pointer-events-none absolute inset-0"></div>
          <svg class="absolute inset-0 -rotate-90" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="ql-ring-track" cx="50" cy="50" r="44" stroke-width="6"/>
            <circle x-ref="doneRing" class="ql-ring" cx="50" cy="50" r="44" stroke-width="6" pathLength="100"/>
          </svg>
          <span class="relative text-primary"><svg th:replace="~{fragments/icons :: check('size-16')}"></svg></span>
        </div>
        <p x-ref="doneTitle" class="text-[28px] font-semibold">Wäsche geschafft</p>
      </div>
      <footer class="pb-6">
        <button type="button" class="btn h-[52px] w-full text-[17px]" :class="buttonShape" @click="restart()">Nochmal von vorn</button>
      </footer>
    </section>
  </main>

  <!-- Erklärung der aktuellen Ansicht -->
  <div x-show="notesOpen" x-cloak class="fixed inset-0 z-10 bg-base-content/20" @click="notesOpen = false"></div>
  <section x-show="notesOpen" x-cloak role="dialog" aria-label="Was passiert hier?"
           class="fixed inset-x-0 bottom-0 z-20 mx-auto max-h-[75dvh] max-w-md overflow-y-auto rounded-t-[22px] bg-base-100 px-5 pt-5 pb-[calc(env(safe-area-inset-bottom)+1.25rem)] shadow-[0_-8px_30px_oklch(0%_0_0/0.12)]"
           x-transition:enter="transition ease-out duration-200" x-transition:enter-start="translate-y-8 opacity-0"
           x-transition:leave="transition ease-in duration-150" x-transition:leave-end="translate-y-8 opacity-0">
    <div class="flex items-center justify-between">
      <h2 class="text-[20px] font-semibold">Was passiert hier?</h2>
      <button type="button" class="btn btn-ghost btn-sm h-11 min-h-11" @click="notesOpen = false">Schließen</button>
    </div>

    <template x-for="group in ['statisch', 'interaktiv', 'bewegt']" :key="group">
      <div class="pt-4">
        <h3 class="text-[13px] font-semibold uppercase tracking-wider text-base-content/50" x-text="group"></h3>
        <ul class="mt-2 flex flex-col gap-2.5">
          <template x-for="(item, index) in notes[group]" :key="group + index">
            <li class="text-[15px] leading-snug">
              <a class="link font-semibold" :href="`/glossar#${item.anchor}`" x-text="item.term"></a>:
              <span class="text-base-content/80" x-text="item.text"></span>
            </li>
          </template>
        </ul>
      </div>
    </template>

    <template x-if="choices.length">
      <div class="pt-6">
        <h3 class="text-[13px] font-semibold uppercase tracking-wider text-base-content/50">Zur Wahl</h3>
        <template x-for="option in choices" :key="option.key">
          <div class="pt-3">
            <p class="pb-1.5 text-[15px]" x-text="option.label"></p>
            <div class="grid grid-cols-2 gap-1 rounded-[14px] bg-base-200 p-1" role="group" :aria-label="option.label">
              <template x-for="[value, label] in option.options" :key="value">
                <button type="button" class="h-11 rounded-[11px] text-[15px]"
                        :class="choice[option.key] === value ? 'bg-base-100 font-semibold shadow-sm' : ''"
                        :aria-pressed="choice[option.key] === value"
                        @click="choice[option.key] = value; replayFinale()" x-text="label"></button>
              </template>
            </div>
          </div>
        </template>
      </div>
    </template>
  </section>
</div>
</body>
</html>
