<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Questlog – Entwurf Wäsche', '/js/draft.js')}"></head>
<body class="bg-base-100 text-base-content">

<!-- Symbole einmal serverseitig gerendert, im Entwurf per Name abrufbar -->
<div hidden>
  <template id="icon-washer"><svg th:replace="~{fragments/icons :: washer('size-full')}"></svg></template>
  <template id="icon-clothesline"><svg th:replace="~{fragments/icons :: clothesline('size-full')}"></svg></template>
  <template id="icon-hanger"><svg th:replace="~{fragments/icons :: hanger('size-full')}"></svg></template>
  <template id="icon-basket"><svg th:replace="~{fragments/icons :: basket('size-full')}"></svg></template>
  <template id="icon-stairs"><svg th:replace="~{fragments/icons :: stairs('size-full')}"></svg></template>
  <template id="icon-key"><svg th:replace="~{fragments/icons :: key('size-full')}"></svg></template>
  <template id="icon-detergent"><svg th:replace="~{fragments/icons :: detergent('size-full')}"></svg></template>
  <template id="icon-clock"><svg th:replace="~{fragments/icons :: clock('size-full')}"></svg></template>
  <template id="icon-check"><svg th:replace="~{fragments/icons :: check('size-full')}"></svg></template>
</div>

<div class="mx-auto flex min-h-dvh max-w-md flex-col px-5" x-data="laundryDraft" :data-labels="labels">

  <!-- Nur im Entwurf: ein Button öffnet die Varianten, damit die Ansicht selbst unverändert bleibt -->
  <div class="flex items-center justify-end pt-2">
    <button type="button" class="h-11 rounded-[12px] px-3 text-[15px] text-base-content/60" @click="sheet = true" :aria-expanded="sheet"
            x-text="`Varianten · ${views[view]}` + (middleViews.length ? ` · ${middleViews[middle]}` : '')"></button>
  </div>

  <!-- Stepper: Etappen als Symbole, der Ring um die aktuelle Etappe zeigt ihre Unterschritte -->
  <header class="relative pt-2 pb-2" x-show="screen !== 'start' && screen !== 'done'" x-cloak
          x-effect="ringKey; $nextTick(() => updateRings())">
    <div class="flex items-center px-[7px] py-[7px]" data-label="Stepper">
      <template x-for="(item, s) in quest.stages" :key="item.name">
        <div class="contents">
          <button type="button" class="relative grid size-11 shrink-0 place-items-center rounded-full transition-colors duration-300" :data-node="s"
                  :class="{ 'bg-primary text-primary-content': stageState(s) === 'current', 'bg-primary/15 text-primary': stageState(s) === 'done', 'bg-base-200 text-base-content/40': stageState(s) === 'open' }"
                  :aria-label="item.name" :tabindex="view === 2 && s === stageIndex ? 0 : -1" @click="togglePeek(s)">
            <span class="size-[22px]" x-html="icon(item.icon)"></span>
            <span class="pointer-events-none absolute -inset-[7px]" :data-ring-host="s"></span>
          </button>
          <template x-if="s < quest.stages.length - 1">
            <div class="relative mx-3 h-0.5 flex-1 rounded-full bg-base-300">
              <div class="absolute inset-y-0 left-0 rounded-full bg-primary transition-[width] duration-[550ms] ease-in-out"
                   :style="`width: ${stageState(s) === 'done' ? 100 : 0}%`"></div>
            </div>
          </template>
        </div>
      </template>
    </div>

    <!-- Variante 3: Unterschritte als Symbole, klappt beim Antippen der Etappe auf -->
    <div x-show="peek" x-cloak class="absolute inset-x-0 top-full z-10 flex"
         :class="['justify-start', 'justify-center', 'justify-end'][stageIndex]"
         x-transition:enter="transition ease-out duration-200" x-transition:enter-start="-translate-y-1 opacity-0"
         x-transition:leave="transition ease-in duration-150" x-transition:leave-end="-translate-y-1 opacity-0">
      <div class="flex items-center gap-2 rounded-[18px] bg-base-100 p-2 shadow-[0_4px_20px_oklch(0%_0_0/0.12)]" data-label="Unterschritte">
        <template x-for="(sub, k) in substeps" :key="stage.name + k">
          <span class="grid size-9 place-items-center rounded-full"
                :class="subState(k) === 'current' ? 'bg-primary text-primary-content' : subState(k) === 'done' ? 'bg-primary/15 text-primary' : 'bg-base-200 text-base-content/40'">
            <span class="size-[18px]" x-html="icon(subState(k) === 'done' ? 'check' : sub.icon)"></span>
          </span>
        </template>
      </div>
    </div>
  </header>

  <main class="flex flex-1 flex-col">

    <!-- Übersicht -->
    <section x-show="screen === 'start'" class="flex flex-1 flex-col">
      <div class="flex flex-1 flex-col items-center justify-evenly gap-8 py-6">
        <div data-enter class="flex flex-col items-center gap-3 text-center" data-label="Quest-Kopf">
          <span class="grid size-20 place-items-center rounded-[24px] bg-primary text-primary-content">
            <span class="size-10" x-html="icon(quest.icon)"></span>
          </span>
          <span class="text-[13px] font-semibold uppercase tracking-[0.14em] text-primary">Quest</span>
          <h1 class="text-[34px] font-bold leading-none" x-text="quest.name"></h1>
          <p class="text-[15px] text-base-content/55" x-text="`${quest.stages.length} Etappen · ${quest.stages.filter((s) => s.wait).length} Wartezeiten`"></p>
        </div>
        <ol data-enter class="flex flex-col" data-label="Ablauf">
          <template x-for="(item, s) in quest.stages" :key="item.name">
            <li class="flex flex-col">
              <div class="flex items-center gap-4">
                <span class="grid size-[46px] shrink-0 place-items-center rounded-full"
                      :class="s === 0 ? 'bg-primary text-primary-content' : 'bg-base-200 text-base-content/55'">
                  <span class="size-[23px]" x-html="icon(item.icon)"></span>
                </span>
                <span class="text-[20px]" :class="s === 0 && 'font-semibold'" x-text="item.name"></span>
              </div>
              <template x-if="item.wait">
                <div class="flex min-h-14 items-center gap-4">
                  <span class="mx-[22px] w-0.5 self-stretch bg-base-300"></span>
                  <span class="flex items-center gap-1.5 text-[15px] text-base-content/55">
                    <span class="size-4" x-html="icon('clock')"></span>
                    <span x-text="`${item.wait.label} · ${duration(item.wait.presets[0])} bis ${duration(item.wait.presets.at(-1))}`"></span>
                  </span>
                </div>
              </template>
            </li>
          </template>
        </ol>
      </div>
      <footer class="pb-6">
        <button type="button" class="btn btn-primary h-[52px] w-full rounded-[14px] text-[17px]" data-label="Hauptaktion" @click="start($event)">Quest starten</button>
      </footer>
    </section>

    <!-- Schritt -->
    <section x-show="screen === 'step'" x-cloak class="flex flex-1 flex-col">
      <div class="my-auto flex flex-col items-center gap-6 py-8 text-center" data-enter>

        <!-- Großes Schritt-Symbol, wird beim Abhaken zum Häkchen -->
        <template x-if="true">
          <div class="relative grid size-24 place-items-center rounded-full transition-colors duration-150" data-celebrate data-label="Schritt-Symbol"
               :class="checking ? 'bg-primary text-primary-content' : 'bg-primary/12 text-primary'">
            <span data-ripple class="absolute inset-0 rounded-full border-2 border-primary opacity-0"></span>
            <span data-burst class="pointer-events-none absolute inset-0"></span>
            <span class="size-11" x-html="icon(checking ? 'check' : step.icon)"></span>
          </div>
        </template>

        <p class="text-[30px] font-semibold leading-tight" x-text="step.title" data-label="Schritt-Titel"></p>

        <!-- Voraussetzung als Erinnerung zum Abhaken -->
        <template x-if="step.needs">
          <button type="button" class="flex w-full max-w-xs items-center gap-3 rounded-[16px] border-2 p-3 text-left transition-colors"
                  :class="packed ? 'border-primary bg-primary/8' : 'border-base-300'" @click="packed = !packed" :aria-pressed="packed" data-label="Mitnehmen">
            <span class="grid size-11 shrink-0 place-items-center rounded-full bg-accent/30 text-base-content">
              <span class="size-[22px]" x-html="icon(step.needs.icon)"></span>
            </span>
            <span class="flex-1">
              <span class="block text-[13px] font-semibold uppercase tracking-wider text-base-content/50">Nicht vergessen</span>
              <span class="block text-[17px] font-semibold" x-text="`${step.needs.label} mitnehmen`"></span>
            </span>
            <span class="grid size-7 shrink-0 place-items-center rounded-full border-2 transition-colors"
                  :class="packed ? 'border-primary bg-primary text-primary-content' : 'border-base-300'">
              <span class="size-4" x-show="packed" x-html="icon('check')"></span>
            </span>
          </button>
        </template>

        <!-- Zeitwahl im Schritt, der die Wartezeit startet -->
        <template x-if="step.startsWait">
          <div class="flex w-full flex-col items-center gap-3" data-label="Zeitwahl">

            <!-- Variante 1: kompakte Leiste -->
            <template x-if="middle === 0">
              <div class="flex w-full flex-col items-center gap-3">
                <p class="text-[15px] text-base-content/55" x-text="step.question"></p>
                <div class="flex w-full rounded-full bg-base-200 p-1" role="group" aria-label="Dauer">
                  <template x-for="preset in stage.wait.presets" :key="preset">
                    <button type="button" class="h-11 flex-1 rounded-full text-[15px] transition-colors"
                            :class="!custom && chosenMinutes === preset ? 'bg-base-100 font-semibold shadow-sm' : 'text-base-content/70'"
                            :aria-pressed="!custom && chosenMinutes === preset" @click="choosePreset(preset)" x-text="duration(preset)"></button>
                  </template>
                  <button type="button" class="h-11 flex-1 rounded-full text-[15px] transition-colors"
                          :class="custom ? 'bg-base-100 font-semibold shadow-sm' : 'text-base-content/70'" :aria-pressed="custom" @click="custom = true">Andere</button>
                </div>
                <div x-show="custom" class="flex items-center gap-5">
                  <button type="button" class="size-11 rounded-full bg-base-200 text-xl" aria-label="Weniger" @click="adjust(-1)">−</button>
                  <span class="min-w-20 text-[17px] font-semibold tabular-nums" x-text="duration(chosenMinutes)"></span>
                  <button type="button" class="size-11 rounded-full bg-base-200 text-xl" aria-label="Mehr" @click="adjust(1)">+</button>
                </div>
                <p class="text-[15px] text-base-content/55">fertig <span x-text="endFor(chosenMinutes)"></span></p>
              </div>
            </template>

            <!-- Variante 2: ein Wert zum Drehen, Vorgaben als Sprungmarken -->
            <template x-if="middle === 1">
              <div class="flex w-full flex-col items-center gap-3">
                <p class="text-[13px] font-semibold uppercase tracking-wider text-base-content/50">Dauer</p>
                <div class="flex items-center gap-6">
                  <button type="button" class="size-12 rounded-full bg-base-200 text-2xl" aria-label="Weniger" @click="adjust(-1); custom = true">−</button>
                  <span class="min-w-28 text-[28px] font-semibold tabular-nums" x-text="duration(chosenMinutes)"></span>
                  <button type="button" class="size-12 rounded-full bg-base-200 text-2xl" aria-label="Mehr" @click="adjust(1); custom = true">+</button>
                </div>
                <div class="flex gap-2">
                  <template x-for="preset in stage.wait.presets" :key="preset">
                    <button type="button" class="h-11 rounded-full px-4 text-[15px] transition-colors"
                            :class="chosenMinutes === preset ? 'bg-primary/12 font-semibold text-primary' : 'text-base-content/60'"
                            @click="choosePreset(preset)" x-text="duration(preset)"></button>
                  </template>
                </div>
                <p class="text-[15px] text-base-content/55">fertig <span x-text="endFor(chosenMinutes)"></span></p>
              </div>
            </template>

            <!-- Variante 3: nach Uhrzeit wählen, wann es fertig ist -->
            <template x-if="middle === 2">
              <div class="flex w-full flex-col items-center gap-3">
                <p class="text-[15px] text-base-content/55">Fertig um</p>
                <div class="grid w-full gap-2" :style="`grid-template-columns: repeat(${stage.wait.presets.length}, minmax(0, 1fr))`">
                  <template x-for="preset in stage.wait.presets" :key="preset">
                    <button type="button" class="flex h-16 flex-col items-center justify-center rounded-[14px] border transition-colors"
                            :class="!custom && chosenMinutes === preset ? 'border-primary bg-primary/10' : 'border-base-300'"
                            :aria-pressed="!custom && chosenMinutes === preset" @click="choosePreset(preset)">
                      <span class="text-[17px] font-semibold" x-text="endFor(preset)"></span>
                      <span class="text-[13px] text-base-content/55" x-text="duration(preset)"></span>
                    </button>
                  </template>
                </div>
                <button type="button" x-show="!custom" class="h-11 text-[15px] text-base-content/60" @click="custom = true">Andere Zeit</button>
                <div x-show="custom" class="flex items-center gap-5">
                  <button type="button" class="size-11 rounded-full bg-base-200 text-xl" aria-label="Weniger" @click="adjust(-1)">−</button>
                  <span class="min-w-32 text-[17px] font-semibold" x-text="endFor(chosenMinutes)"></span>
                  <button type="button" class="size-11 rounded-full bg-base-200 text-xl" aria-label="Mehr" @click="adjust(1)">+</button>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>

      <footer class="flex flex-col gap-1 pb-6">
        <button type="button" x-show="step.missing" class="btn btn-ghost h-11 min-h-11 w-full text-[15px] font-normal text-base-content/70"
                data-label="Zweitaktion" @click="reportMissing($event)" x-text="`${step.missing} fehlt`"></button>
        <button type="button" class="btn btn-primary h-[52px] w-full rounded-[14px] text-[17px]" data-label="Hauptaktion"
                @click="complete($event)" x-text="step.startsWait ? step.action : 'Erledigt'"></button>
      </footer>
    </section>

    <!-- Etwas fehlt -->
    <section x-show="screen === 'missing'" x-cloak class="flex flex-1 flex-col">
      <div class="my-auto flex flex-col items-center gap-5 py-10 text-center">
        <span data-enter class="relative grid size-24 place-items-center rounded-full bg-error/12 text-error" data-label="Schritt-Symbol">
          <span class="size-11" x-html="icon('detergent')"></span>
          <span class="absolute h-[3px] w-14 rotate-45 rounded-full bg-error"></span>
        </span>
        <p data-enter class="text-[30px] font-semibold leading-tight" x-text="`${step.missing ?? ''} fehlt`" data-label="Schritt-Titel"></p>
        <p data-enter class="max-w-xs text-[17px] text-base-content/65">Die Quest wartet hier und geht an dieser Stelle weiter.</p>
      </div>
      <footer class="flex flex-col gap-2 pb-6">
        <a class="btn h-[52px] w-full rounded-[14px] border-2 border-base-300 bg-transparent text-[17px] font-semibold" :href="shoppingLink" data-label="Zweitaktion">
          Auf die Einkaufsliste
        </a>
        <button type="button" class="btn btn-primary h-[52px] w-full rounded-[14px] text-[17px]" data-label="Hauptaktion"
                @click="resolveMissing($event)" x-text="`${step.missing ?? ''} ist da`"></button>
      </footer>
    </section>

    <!-- Wartezeit -->
    <section x-show="waiting" x-cloak class="flex flex-1 flex-col">
      <div class="my-auto flex flex-col items-center gap-6 py-8 text-center">
        <div data-enter class="relative grid size-60 place-items-center" data-label="Timer-Ring">
          <svg x-show="middle !== 2 || screen === 'waitDone'" class="absolute inset-0 -rotate-90" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="ql-ring-track" cx="50" cy="50" r="47" stroke-width="2.5"/>
            <circle x-ref="timerRing" class="ql-ring transition-[stroke-dashoffset] duration-1000 ease-linear"
                    cx="50" cy="50" r="47" stroke-width="2.5" pathLength="100" style="stroke-dashoffset: 0"/>
          </svg>
          <span x-show="middle === 2 && screen === 'wait'" class="absolute inset-0" x-html="waitRingSvg()"></span>

          <span x-show="screen === 'wait' && middle === 0" class="relative text-[34px] font-semibold tabular-nums" x-text="countdownText"></span>
          <span x-show="screen === 'wait' && middle === 1" class="relative flex flex-col items-center gap-1">
            <span class="text-[13px] font-semibold uppercase tracking-wider text-base-content/50">fertig</span>
            <span class="text-[28px] font-semibold" x-text="endText"></span>
          </span>
          <span x-show="screen === 'wait' && middle === 2" class="relative max-w-44 text-[20px] font-semibold leading-snug" x-text="wordsText"></span>
          <span x-show="screen === 'waitDone'" class="relative size-14 text-primary" x-html="icon('check')"></span>
        </div>
        <div data-enter class="flex flex-col gap-1">
          <p class="text-[20px] font-semibold" x-text="screen === 'wait' ? `${stage.wait?.label} läuft` : `${stage.wait?.label} fertig`"></p>
          <p class="text-[15px] text-base-content/60" x-show="screen === 'wait'">
            <span x-text="middle === 1 ? wordsText : `fertig ${endText}`"></span><br>
            Danach erinnere ich dich <span x-text="stage.wait?.reminder"></span>.
          </p>
        </div>
      </div>
      <footer class="pb-6">
        <button type="button" x-show="screen === 'wait'" class="btn btn-ghost h-[52px] w-full font-normal text-base-content/60"
                @click="skipTime()">Zeit vorspulen (nur im Entwurf)</button>
        <button type="button" x-show="screen === 'waitDone'" class="btn btn-primary h-[52px] w-full rounded-[14px] text-[17px]" data-label="Hauptaktion"
                @click="continueQuest($event)">Weiter: <span x-text="nextStage?.name"></span></button>
      </footer>
    </section>

    <!-- Abschluss -->
    <section x-show="screen === 'done'" x-cloak class="flex flex-1 flex-col">
      <div class="my-auto flex flex-col items-center gap-6 py-10 text-center">
        <div class="relative grid size-48 place-items-center">
          <svg class="absolute inset-0 -rotate-90" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="ql-ring-track" cx="50" cy="50" r="44" stroke-width="6"/>
            <circle x-ref="doneRing" class="ql-ring" cx="50" cy="50" r="44" stroke-width="6" pathLength="100"/>
          </svg>
          <span class="relative size-16 text-primary" x-html="icon('check')"></span>
        </div>
        <p x-ref="doneTitle" class="text-[28px] font-semibold">Wäsche geschafft</p>
      </div>
      <footer class="pb-6">
        <button type="button" class="btn h-[52px] w-full rounded-[14px] text-[17px]" @click="restart()">Nochmal von vorn</button>
      </footer>
    </section>
  </main>
  <div x-show="sheet" x-cloak class="fixed inset-0 z-30 bg-base-content/20" @click="sheet = false"></div>
  <section x-show="sheet" x-cloak role="dialog" aria-label="Varianten"
           class="fixed inset-x-0 bottom-0 z-40 mx-auto flex max-w-md flex-col gap-5 rounded-t-[22px] bg-base-100 px-5 pt-5 pb-[calc(env(safe-area-inset-bottom)+1.25rem)] shadow-[0_-8px_30px_oklch(0%_0_0/0.12)]"
           x-transition:enter="transition ease-out duration-200" x-transition:enter-start="translate-y-8 opacity-0"
           x-transition:leave="transition ease-in duration-150" x-transition:leave-end="translate-y-8 opacity-0">
    <div class="flex items-center justify-between">
      <h2 class="text-[20px] font-semibold">Varianten</h2>
      <button type="button" class="h-11 px-2 text-[15px] font-semibold" @click="sheet = false">Fertig</button>
    </div>
    <div class="flex flex-col gap-2">
      <p class="text-[15px] text-base-content/60">Oben: Stepper</p>
      <div class="grid grid-cols-3 gap-1 rounded-[14px] bg-base-200 p-1" role="group" aria-label="Varianten oben">
        <template x-for="(name, i) in views" :key="name">
          <button type="button" class="h-11 rounded-[11px] text-[15px]" :class="view === i && 'bg-base-100 font-semibold shadow-sm'"
                  :aria-pressed="view === i" @click="view = i" x-text="name"></button>
        </template>
      </div>
    </div>
    <div class="flex flex-col gap-2" x-show="middleViews.length">
      <p class="text-[15px] text-base-content/60" x-text="middleKind === 'choose' ? 'Mitte: Zeitwahl' : 'Mitte: laufende Zeit'"></p>
      <div class="grid grid-cols-3 gap-1 rounded-[14px] bg-base-200 p-1" role="group" aria-label="Varianten Mitte">
        <template x-for="(name, i) in middleViews" :key="middleKind + name">
          <button type="button" class="h-11 rounded-[11px] text-[15px]" :class="middle === i && 'bg-base-100 font-semibold shadow-sm'"
                  :aria-pressed="middle === i" @click="middle = i" x-text="name"></button>
        </template>
      </div>
    </div>
    <button type="button" class="flex h-12 items-center justify-between rounded-[14px] bg-base-200 px-4 text-[15px]" :aria-pressed="labels" @click="labels = !labels">
      <span>Elemente beschriften</span>
      <span class="relative h-7 w-12 rounded-full transition-colors" :class="labels ? 'bg-primary' : 'bg-base-300'">
        <span class="absolute top-0.5 size-6 rounded-full bg-base-100 shadow transition-[left]" :class="labels ? 'left-[22px]' : 'left-0.5'"></span>
      </span>
    </button>
  </section>
</div>
</body>
</html>
