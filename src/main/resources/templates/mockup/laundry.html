<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Questlog – Mockup ' + ${intensity.label}, '/js/mockup.js')}"></head>
<body class="bg-base-100 text-base-content">
<div class="mx-auto flex min-h-dvh max-w-md flex-col px-5"
     th:data-intensity="${intensity.slug}" x-data="laundryMockup($el.dataset.intensity)">

  <!-- Nur für den Vergleich der Mockups; gehört nicht zur späteren Ansicht. -->
  <nav aria-label="Animationsstärke" class="flex items-center gap-1 pt-3">
    <a th:each="option : ${intensities}" th:href="@{/mockups/{slug}(slug=${option.slug})}"
       th:text="${option.label}" th:attr="aria-current=${option == intensity} ? 'page'"
       class="btn btn-ghost btn-sm h-11 min-h-11 flex-1 px-1 font-normal"
       th:classappend="${option == intensity} ? 'btn-active font-semibold'">Stärke</a>
  </nav>

  <!-- Kopfzeile: Quest, Etappe und Schritt-Ring der aktuellen Etappe -->
  <header class="flex items-center gap-3 pt-4 pb-2" x-show="screen === 'step'" x-cloak>
    <div class="min-w-0 flex-1">
      <p class="font-semibold" x-text="quest.name"></p>
      <p class="text-sm text-base-content/60">
        <span x-text="stage.name"></span> · Schritt <span x-text="stepIndex + 1"></span> von <span x-text="stage.steps.length"></span>
      </p>
    </div>
    <svg class="size-11 shrink-0 -rotate-90" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="ql-ring-track" cx="50" cy="50" r="40" stroke-width="12"/>
      <circle x-ref="stepRing" class="ql-ring" cx="50" cy="50" r="40" stroke-width="12" pathLength="100"/>
    </svg>
  </header>

  <main class="flex flex-1 flex-col">

    <!-- Start -->
    <section x-show="screen === 'start'" class="flex flex-1 flex-col">
      <div class="my-auto flex flex-col gap-6 py-10">
        <h1 data-enter class="text-4xl font-semibold tracking-tight" x-text="quest.name"></h1>
        <ol class="flex flex-col gap-3">
          <template x-for="(item, index) in quest.stages" :key="item.name">
            <li data-enter class="flex items-baseline gap-3">
              <span class="w-5 shrink-0 text-sm text-base-content/50 tabular-nums" x-text="index + 1"></span>
              <span class="text-lg" x-text="item.name"></span>
              <span class="ml-auto text-sm text-base-content/60" x-show="item.wait"
                    x-text="item.wait && `danach ${item.wait.label}`"></span>
            </li>
          </template>
        </ol>
      </div>
      <footer class="pb-6">
        <button type="button" data-enter class="btn btn-primary btn-lg h-14 w-full" @click="start($event)">Quest starten</button>
      </footer>
    </section>

    <!-- Schritt -->
    <section x-show="screen === 'step'" x-cloak class="flex flex-1 flex-col">
      <div class="my-auto flex flex-col gap-5 py-10">
        <p data-enter class="text-[2.125rem] font-semibold leading-tight" x-text="step.title"></p>
        <ul x-ref="needs" data-enter class="flex gap-2" x-show="step.needs" aria-label="Benötigt">
          <template x-for="need in step.needs ?? []" :key="need">
            <li class="relative grid size-11 place-items-center rounded-full bg-base-200 text-base-content/70"
                :class="step.check && missing && 'bg-error/15 text-error'"
                :aria-label="needs[need].label + (step.check && missing ? ' fehlt' : '')">
              <template x-if="need === 'key'"><svg th:replace="~{fragments/icons :: key('size-6')}"></svg></template>
              <template x-if="need === 'detergent'"><svg th:replace="~{fragments/icons :: detergent('size-6')}"></svg></template>
              <span x-show="step.check && missing" class="absolute h-0.5 w-8 rotate-45 rounded-full bg-error"></span>
            </li>
          </template>
        </ul>
        <p x-show="step.check && missing" data-enter class="text-error">
          Erst <span x-text="needs[step.needs?.[0]]?.label"></span> besorgen, dann geht es weiter.
        </p>
      </div>

      <footer class="flex gap-3 pb-6">
        <template x-if="!step.check || missing">
          <button type="button" data-enter class="btn btn-primary btn-lg relative h-14 flex-1" @click="complete($event)">
            <span data-burst class="pointer-events-none absolute inset-0"></span>
            <span x-text="step.check ? 'Jetzt vorhanden' : 'Erledigt'"></span>
          </button>
        </template>
        <template x-if="step.check && !missing">
          <div class="flex flex-1 gap-3">
            <button type="button" data-enter class="btn btn-lg h-14 flex-1" @click="markMissing()">Fehlt</button>
            <button type="button" data-enter class="btn btn-primary btn-lg relative h-14 flex-[2]" @click="complete($event)">
              <span data-burst class="pointer-events-none absolute inset-0"></span>Ist da
            </button>
          </div>
        </template>
      </footer>
    </section>

    <!-- Wartezeit -->
    <section x-show="screen === 'wait' || screen === 'waitDone'" x-cloak class="flex flex-1 flex-col">
      <div class="my-auto flex flex-col items-center gap-6 py-10 text-center">
        <div data-enter class="relative grid size-64 place-items-center">
          <span x-ref="breath" class="absolute inset-8 rounded-full bg-primary/20"></span>
          <svg class="absolute inset-0 -rotate-90" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="ql-ring-track" cx="50" cy="50" r="46" stroke-width="3"/>
            <circle x-ref="timerRing" class="ql-ring transition-[stroke-dashoffset] duration-1000 ease-linear"
                    cx="50" cy="50" r="46" stroke-width="3" pathLength="100" style="stroke-dashoffset: 0"/>
          </svg>
          <span class="relative text-3xl font-semibold tabular-nums" x-show="screen === 'wait'" x-text="remainingText"></span>
          <span x-show="screen === 'waitDone'" class="relative"><svg th:replace="~{fragments/icons :: check('size-16 text-primary')}"></svg></span>
        </div>
        <div data-enter class="flex flex-col gap-1">
          <p class="text-xl font-semibold"
             x-text="screen === 'wait' ? `${stage.wait?.label} läuft` : `${stage.wait?.label} fertig`"></p>
          <p class="text-base-content/70" x-show="screen === 'wait'">
            Erinnerung <span x-text="stage.wait?.repeat"></span>, bis du weitermachst.
          </p>
        </div>
      </div>
      <footer class="pb-6">
        <button type="button" data-enter class="btn btn-ghost h-14 w-full" x-show="screen === 'wait'" @click="skipTime()">
          Zeit vorspulen (nur im Mockup)
        </button>
        <button type="button" data-enter class="btn btn-primary btn-lg relative h-14 w-full" x-show="screen === 'waitDone'"
                @click="continueQuest($event)">
          <span data-burst class="pointer-events-none absolute inset-0"></span>
          Weiter: <span x-text="nextStage?.name"></span>
        </button>
      </footer>
    </section>

    <!-- Abschluss -->
    <section x-show="screen === 'done'" x-cloak class="flex flex-1 flex-col">
      <div class="my-auto flex flex-col items-center gap-6 py-10 text-center">
        <div class="relative grid size-56 place-items-center">
          <div x-ref="confetti" class="pointer-events-none absolute inset-0"></div>
          <svg x-ref="doneRingGroup" class="absolute inset-0 -rotate-90" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="ql-ring-track" cx="50" cy="50" r="42" stroke-width="8"/>
            <circle x-ref="doneRing" class="ql-ring" cx="50" cy="50" r="42" stroke-width="8" pathLength="100"/>
          </svg>
          <svg th:replace="~{fragments/icons :: check('relative size-20 text-primary')}"></svg>
        </div>
        <p x-ref="doneTitle" class="text-3xl font-semibold">Wäsche geschafft</p>
      </div>
      <footer class="pb-6">
        <button type="button" data-enter class="btn btn-lg h-14 w-full" @click="restart()">Nochmal ansehen</button>
      </footer>
    </section>
  </main>
</div>
</body>
</html>
