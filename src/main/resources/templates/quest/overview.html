<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Questlog', '/js/draft.js')}"></head>
<body class="bg-base-100 text-base-content">
<link rel="stylesheet" th:href="@{/css/scenes.css}">
<div th:replace="~{fragments/scenes :: scenes}"></div>

<main class="mx-auto flex min-h-dvh max-w-md flex-col px-5 pb-6" x-data="questOverview">
  <header class="pt-3 pb-1.5">
    <p class="text-[14px] text-base-content/55" x-text="today"></p>
    <h1 class="text-[32px] font-bold leading-tight">Questlog</h1>
  </header>

  <!-- Eine Sache im Fokus: groß, was als Nächstes dran ist, mit der Szene der Quest -->
  <p class="mt-3.5 text-[13px] font-semibold uppercase tracking-[0.1em] text-base-content/55">Als Nächstes</p>
  <a th:href="@{/entwurf/waesche}" class="mt-2 flex flex-col items-center rounded-3xl bg-base-200 px-4 py-[18px] text-center active:scale-[0.99] transition-transform"
     data-label="Quest im Fokus">
    <div class="ql-scene size-[190px]" x-html="scene(sceneName)"></div>
    <b class="mt-1 text-[22px]" x-text="quest.name"></b>
    <span class="text-[15px] text-base-content/55" x-text="status"></span>
    <div x-show="timed" x-cloak class="mt-3.5 w-full">
      <div class="relative h-1.5 rounded-full bg-base-300">
        <!-- Fertig: die Zeit bis zum Ziel nimmt 80 % ein, der Rest ist die Überzeit, wie in der Quest -->
        <i class="absolute inset-y-0 left-0 rounded-full bg-primary transition-[width] duration-1000 ease-linear"
           :style="`width:${late ? 80 : progress}%`"></i>
        <i x-show="late" class="absolute inset-y-0 right-0 left-[80%] rounded-r-full bg-accent"></i>
      </div>
      <span class="mt-2 flex items-center justify-center gap-1.5 text-[14px]"
            :class="late ? 'font-semibold text-accent' : 'text-base-content/55'">
        <svg th:replace="~{fragments/icons :: clock('size-4')}"></svg><span x-text="timeText"></span>
      </span>
    </div>
  </a>

  <p class="mt-[22px] text-[13px] font-semibold uppercase tracking-[0.1em] text-base-content/55">Weitere Quests</p>
  <div class="mt-2 rounded-2xl border-[1.5px] border-dashed border-base-300 p-4 text-[15px] text-base-content/55">Noch keine.</div>
</main>
</body>
</html>
