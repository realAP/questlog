<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title th:text="${title}">Questlog</title>
  <meta name="theme-color" content="#f9f7f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#262320" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="icon" type="image/png" sizes="192x192" th:href="@{/icons/icon-192.png}">

  <link rel="stylesheet" th:href="@{/css/app.css}">
