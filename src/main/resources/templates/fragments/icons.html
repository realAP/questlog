<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Linien-Icons im 24er-Raster; Farbe über currentColor, Größe über die übergebene Klasse. -->
<svg th:fragment="check(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M5 12.5l4.5 4.5L19 7.5"/>
</svg>
<svg th:fragment="key(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <circle cx="8" cy="15.5" r="4"/>
  <path d="M11 12.5l8-8M15.5 8l2.5 2.5M13.5 10l2 2"/>
</svg>
<svg th:fragment="detergent(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M10 3h4v3l2.5 2.5V20a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1V8.5L10 6z"/>
  <path d="M7.5 12.5h9"/>
</svg>
<svg th:fragment="clock(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <circle cx="12" cy="12" r="8.5"/>
  <path d="M12 7.5V12l3 2"/>
</svg>
<svg th:fragment="back(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M14.5 5.5L8 12l6.5 6.5"/>
</svg>
</body>
</html>
