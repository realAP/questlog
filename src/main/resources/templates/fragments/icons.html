<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Linien-Icons im 24er-Raster; Farbe über currentColor, Größe über die übergebene Klasse. -->
<svg th:fragment="check(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M5 12.5l4.5 4.5L19 7.5"/>
</svg>
<svg th:fragment="key(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <circle cx="8" cy="15.5" r="4"/>
  <path d="M11 12.5l8-8M15.5 8l2.5 2.5M13.5 10l2 2"/>
</svg>
<svg th:fragment="detergent(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M10 3h4v3l2.5 2.5V20a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1V8.5L10 6z"/>
  <path d="M7.5 12.5h9"/>
</svg>
<svg th:fragment="clock(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <circle cx="12" cy="12" r="8.5"/>
  <path d="M12 7.5V12l3 2"/>
</svg>
<svg th:fragment="washer(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <rect x="4" y="3" width="16" height="18" rx="2.5"/>
  <path d="M4 7.5h16"/>
  <circle cx="12" cy="14" r="4"/>
  <path d="M7 5.25h.01M9.5 5.25h.01"/>
</svg>
<svg th:fragment="hanger(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M10 6.5a2 2 0 1 1 2.8 1.8c-.5.3-.8.8-.8 1.4V11"/>
  <path d="M12 11l-8.3 5.4A1.3 1.3 0 0 0 4.4 19h15.2a1.3 1.3 0 0 0 .7-2.6z"/>
</svg>
<svg th:fragment="basket(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M3.5 9.5h17"/>
  <path d="M5 9.5l1.4 9.2a1.5 1.5 0 0 0 1.5 1.3h8.2a1.5 1.5 0 0 0 1.5-1.3L19 9.5"/>
  <path d="M8 9.5l2-5M16 9.5l-2-5"/>
  <path d="M9.5 13v3.5M14.5 13v3.5"/>
</svg>
<svg th:fragment="stairs(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M3.5 20h4.5v-4.5h4.5V11h4.5V6.5h3.5"/>
</svg>
<svg th:fragment="clothesline(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M2.5 5.5c6 2 13 2 19 0"/>
  <path d="M5.5 6.5v10a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-9.6"/>
  <path d="M13.5 7.2v6.3a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1V6.6"/>
</svg>
<svg th:fragment="plus(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
  <path d="M12 5v14M5 12h14"/>
</svg>
<svg th:fragment="minus(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
  <path d="M5 12h14"/>
</svg>
<svg th:fragment="back(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M14.5 5.5L8 12l6.5 6.5"/>
</svg>
<svg th:fragment="person(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <circle cx="12" cy="8.5" r="3.8"/>
  <path d="M4.5 20c1.2-3.8 4-5.5 7.5-5.5s6.3 1.7 7.5 5.5"/>
</svg>
<svg th:fragment="lock(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <rect x="5" y="10.5" width="14" height="10" rx="2.5"/>
  <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>
</svg>
<svg th:fragment="eye(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/>
  <circle cx="12" cy="12" r="2.8"/>
</svg>
<svg th:fragment="eyeOff(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/>
  <circle cx="12" cy="12" r="2.8"/>
  <path d="M4 4l16 16"/>
</svg>
<!-- Kolben: markiert Testfunktionen der Beta -->
<svg th:fragment="flask(cls)" th:class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M9 3h6M10 3v6.2L4.8 18.4A1.8 1.8 0 0 0 6.4 21h11.2a1.8 1.8 0 0 0 1.6-2.6L14 9.2V3"/>
  <path d="M7.2 15h9.6"/>
</svg>
<!-- App-Symbol wie icon-512.png: dunkles Quadrat, grüner Ring, heller Punkt -->
<svg th:fragment="appLogo(cls)" th:class="${cls}" viewBox="0 0 100 100" aria-hidden="true">
  <rect width="100" height="100" rx="23" fill="#2a2724"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#4a4541" stroke-width="9"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#7fc4ab" stroke-width="9" stroke-linecap="round"
          pathLength="100" stroke-dasharray="75 100" transform="rotate(-90 50 50)"/>
  <circle cx="50" cy="50" r="5" fill="#f2ede4"/>
</svg>
</body>
</html>
