name: Pipeline

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Integrationstests starten PostgreSQL per Testcontainers im Docker des Runners.
      - name: Build und alle Tests
        run: ./mvnw -B package
      - name: Statische Prüfungen
        run: ./mvnw -B spotless:check checkstyle:check pmd:check pmd:cpd-check spotbugs:check

  smoke:
    name: Smoke-Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Image bauen, Compose starten, Endpunkte prüfen
        run: scripts/smoke-test.sh

  deploy:
    name: Deploy
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Coolify-Deploy-Webhook aufrufen
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [[ -z "${COOLIFY_WEBHOOK}" || -z "${COOLIFY_TOKEN}" ]]; then
            echo "::error::GitHub-Secrets COOLIFY_WEBHOOK und COOLIFY_TOKEN fehlen (siehe README, Einrichtung in Coolify)."
            exit 1
          fi
          curl -fsS --retry 3 -H "Authorization: Bearer ${COOLIFY_TOKEN}" "${COOLIFY_WEBHOOK}"
