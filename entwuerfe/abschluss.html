<title>Questlog – Abschlussfeier, Varianten</title>
<style>
  :root {
    --bg: oklch(98.5% 0.006 85); --card: oklch(95.5% 0.008 85); --line: oklch(91% 0.01 85);
    --ink: oklch(28% 0.015 70); --muted: oklch(28% 0.015 70 / 0.55);
    --pr: oklch(52% 0.07 165); --pr2: oklch(80% 0.05 165); --ac: oklch(74% 0.11 70); --c3: oklch(86% 0.02 70); --prc: oklch(98% 0.01 165);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: oklch(21% 0.008 70); --card: oklch(25% 0.01 70); --line: oklch(31% 0.012 70);
      --ink: oklch(92% 0.008 85); --muted: oklch(92% 0.008 85 / 0.55);
      --pr: oklch(72% 0.08 165); --pr2: oklch(45% 0.05 165); --ac: oklch(78% 0.1 70); --c3: oklch(40% 0.02 70); --prc: oklch(20% 0.02 165);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }
  h1 { font-size: 28px; margin: 8px 0 4px; }
  .hint { color: var(--muted); font-size: 15px; margin: 0 0 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  figure { margin: 0; cursor: pointer; }
  figcaption { font-size: 14px; margin-top: 8px; } figcaption b { display: block; font-size: 15px; } figcaption span { color: var(--muted); }
  .phone { position: relative; aspect-ratio: 9 / 16; border-radius: 22px; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 22px; padding: 34px 12px 0; overflow: hidden; }
  .ttl { margin: 0; font-size: 22px; font-weight: 650; }
  .row { display: flex; align-items: center; width: 100%; max-width: 190px; }
  .row.spread { justify-content: space-between; }
  .node { position: relative; display: grid; place-items: center; width: 38px; height: 38px; flex: none; border-radius: 50%; background: var(--line); color: var(--muted); }
  .node > svg { width: 20px; height: 20px; }
  .node .on { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 50%; background: var(--pr); color: var(--prc); opacity: 0; }
  .node .on svg { width: 20px; height: 20px; }
  .lnk { position: relative; flex: 1; height: 2px; margin: 0 6px; border-radius: 1px; background: var(--line); }
  .lnk i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 1px; background: var(--pr); }
  .badge { position: relative; display: grid; place-items: center; flex: none; }
  .rg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .badge > .rg:not([style*="rotate"]) { transform: rotate(-90deg); }
  .trk { fill: none; stroke: var(--line); stroke-width: 6; }
  .ring { fill: none; stroke: var(--pr); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; }
  .chk { position: relative; width: 56px; height: 56px; color: var(--pr); opacity: 0; }
  .chk.light { color: var(--prc); } .chk.small { position: absolute; top: -14px; width: 40px; height: 40px; }
  .disc { position: absolute; inset: 22%; border-radius: 50%; background: var(--pr); transform: scale(0); }
  .disc.small { inset: auto; top: -26px; width: 64px; height: 64px; }
  .sp { position: absolute; margin: -9px; fill: var(--pr); opacity: 0; }
  .onring { position: absolute; display: grid; place-items: center; width: 34px; height: 34px; margin: -17px; border-radius: 50%; background: var(--card); color: var(--muted); }
  .onring > svg { width: 18px; height: 18px; }
  .onring .on { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 50%; background: var(--pr); color: var(--prc); opacity: 0; }
  .onring .on svg { width: 18px; height: 18px; }
  #big { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; background: var(--bg); }
  #big.open { display: grid; }
  #big .phone { width: min(390px, 92vw); height: min(760px, 92dvh); aspect-ratio: auto; transform: scale(1.15); transform-origin: 50% 20%; }
